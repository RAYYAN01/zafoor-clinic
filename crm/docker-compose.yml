services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital_crm
    ports:
      - "5432:5432"
    volumes:
      - hospital_crm_db:/var/lib/postgresql/data

volumes:
  hospital_crm_db:
